<!doctype html>
<html>
  <head>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    />

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        max-width: 100%;
        min-width: 0;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }

      html {
        background: linear-gradient(180deg, #eef7ff 0%, #f7f9fc 100%);
      }

      body {
        min-height: 100dvh;

        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;

        color: #222;

        background: linear-gradient(180deg, #eef7ff 0%, #f7f9fc 100%);

        overflow-x: hidden;

        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);

        font-size: 22px;
        line-height: 1.55;

        -webkit-text-size-adjust: 100%;
      }

      .container {
        width: 100%;
        max-width: none;

        min-height: 100vh;
        min-height: 100dvh;

        margin: 0;

        padding: 8px 0 24px;
      }

      .header {
        width: 100%;
        text-align: center;
        padding: 8px 8px 18px;
      }

      .header-title {
        margin: 0;

        font-size: 30px;
        line-height: 1.25;

        font-weight: 900;

        color: #1565c0;
      }

      .header-subtitle {
        margin: 8px 0 0;

        font-size: 25px;
        line-height: 1.45;

        font-weight: 700;

        color: #667085;
      }

      .language-switcher {
        display: flex;

        justify-content: center;
        align-items: center;

        gap: 10px;

        margin-bottom: 14px;
      }

      .language-button {
        width: auto;

        min-width: 112px;
        min-height: 58px;

        margin: 0;
        padding: 10px 20px;

        border: 2px solid #d0d7de;
        border-radius: 999px;

        background: #fff;
        color: #555;

        font-size: 23px;
        font-weight: 900;
      }

      .language-button.active {
        background: #1976d2;
        border-color: #1976d2;
        color: #fff;
      }

      .language-divider {
        color: #aaa;
        font-size: 23px;
        font-weight: 700;
      }

      .home-button {
        width: 100%;

        min-height: 70px;

        margin: 0 0 14px;

        padding: 12px;

        border: 2px solid #d8e5f2;
        border-radius: 0;

        background: #fff;
        color: #1565c0;

        font-size: 25px;
        font-weight: 900;

        box-shadow: 0 3px 12px rgba(21, 101, 192, 0.08);
      }

      .checkin-id-card {
        width: 100%;

        margin-bottom: 14px;

        padding: 24px 10px;

        text-align: center;

        color: #fff;

        background: linear-gradient(135deg, #1565c0, #42a5f5);

        border-radius: 0;

        box-shadow: 0 8px 24px rgba(21, 101, 192, 0.22);
      }

      .checkin-id-label {
        margin-bottom: 8px;

        font-size: 25px;
        line-height: 1.4;

        font-weight: 800;

        opacity: 0.95;
      }

      .checkin-id {
        font-size: 24px;
        line-height: 1.3;

        font-weight: 800;

        letter-spacing: 1px;

        word-break: break-all;
      }

      .checkin-activity-title {
        margin-top: 8px;

        font-size: 20px;
        line-height: 1.4;

        font-weight: 800;
      }

      .checkin-date {
        margin-top: 6px;

        font-size: 23px;
        line-height: 1.4;

        font-weight: 700;

        opacity: 0.95;
      }

      .card,
      .member-card,
      .empty {
        width: 100%;
        background: #fff;
      }

      .card {
        margin-bottom: 10px;

        padding: 18px 10px;

        border-radius: 0;

        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.05);
      }

      .card-title {
        margin-bottom: 12px;

        font-size: 29px;
        line-height: 1.35;

        font-weight: 900;
      }

      label {
        display: block;

        margin-top: 14px;

        font-size: 25px;
        line-height: 1.4;

        font-weight: 900;
      }

      input,
      select {
        display: block;

        width: 100%;

        min-height: 68px;

        margin-top: 8px;

        padding: 12px 14px;

        border: 2px solid #d5dbe3;
        border-radius: 11px;

        background: #fff;
        color: #222;

        font-size: 24px;
        line-height: 1.4;

        font-weight: 600;

        outline: none;

        -webkit-text-size-adjust: 100%;
      }

      input:focus,
      select:focus {
        border-color: #1976d2;

        box-shadow: 0 0 0 4px rgba(25, 118, 210, 0.12);
      }

      input::placeholder {
        color: #888;
        opacity: 1;
        font-size: 23px;
      }

      button {
        width: 100%;

        min-height: 70px;

        margin-top: 12px;

        padding: 12px 14px;

        border: 0;

        border-radius: 11px;

        background: #1976d2;
        color: #fff;

        font-size: 25px;

        line-height: 1.35;

        font-weight: 900;

        cursor: pointer;

        -webkit-tap-highlight-color: transparent;

        touch-action: manipulation;
      }

      button:active {
        transform: scale(0.985);
      }

      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
        transform: none;
      }

      .load-button {
        background: linear-gradient(135deg, #1976d2, #42a5f5);

        box-shadow: 0 4px 12px rgba(25, 118, 210, 0.18);
      }

      .today-activity-list {
        display: grid;

        gap: 8px;

        margin-top: 12px;
      }

      .activity-option {
        width: 100%;

        min-height: 82px;

        margin: 0;

        padding: 12px;

        text-align: left;

        background: #f7faff;
        color: #123;

        border: 2px solid #d9e8f8;

        border-radius: 10px;
      }

      .activity-option.active {
        background: #e3f2fd;

        border-color: #1976d2;

        color: #0d47a1;
      }

      .activity-option-title {
        font-size: 20px;

        line-height: 1.35;

        font-weight: 800;
      }

      .activity-option-info {
        margin-top: 4px;

        color: #666;

        font-size: 21px;

        line-height: 1.45;

        font-weight: 600;
      }

      .summary {
        display: grid;

        grid-template-columns: 1fr 1fr;

        gap: 8px;
      }

      .summary-box {
        padding: 14px 8px;

        text-align: center;

        background: #f5f7fa;

        border-radius: 12px;
      }

      .summary-box.checked-summary {
        background: #e8f5e9;
      }

      .summary-number {
        color: #1976d2;

        font-size: 50px;

        line-height: 1.05;

        font-weight: 900;
      }

      .checked-summary .summary-number {
        color: #2e7d32;
      }

      .summary-label {
        margin-top: 5px;

        color: #666;

        font-size: 22px;

        line-height: 1.3;

        font-weight: 800;
      }

      .search-input {
        margin-top: 0;
      }

      .member-card {
        margin-bottom: 9px;

        padding: 16px 12px;

        border-left: 7px solid #bdbdbd;

        border-radius: 0;

        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.05);
      }

      .member-card.checked {
        background: #f0fff3;

        border-left-color: #2e7d32;
      }

      .member-name {
        margin-bottom: 7px;

        font-size: 34px;

        line-height: 1.25;

        font-weight: 900;

        word-break: break-word;
      }

      .member-info {
        color: #555;

        font-size: 23px;

        line-height: 1.55;

        font-weight: 600;
      }

      .member-status {
        display: inline-block;

        margin-top: 9px;

        padding: 7px 13px;

        border-radius: 999px;

        font-size: 21px;

        line-height: 1.3;

        font-weight: 900;
      }

      .status-not {
        background: #fff3e0;

        color: #ef6c00;
      }

      .status-checked {
        background: #c8e6c9;

        color: #1b5e20;
      }

      .payment-select {
        margin-top: 12px;
      }

      .checkin-button {
        min-height: 76px;

        margin-top: 12px;

        background: linear-gradient(135deg, #2e7d32, #43a047);

        font-size: 27px;

        box-shadow: 0 4px 12px rgba(46, 125, 50, 0.18);
      }

      .checkin-button.loading {
        background: #78909c;
      }

      .empty {
        padding: 30px 12px;

        text-align: center;

        color: #777;

        font-size: 24px;

        line-height: 1.5;

        font-weight: 700;
      }

      .error,
      .success-message {
        width: 100%;

        margin-bottom: 10px;

        padding: 15px 12px;

        border-radius: 0;

        font-size: 22px;

        line-height: 1.5;

        font-weight: 800;
      }

      .error {
        background: #ffebee;
        color: #c62828;
      }

      .success-message {
        background: #e8f5e9;

        color: #2e7d32;

        font-size: 24px;

        font-weight: 900;
      }

      @media (max-width: 600px) {
        html,
        body {
          width: 100%;
          max-width: 100%;

          margin: 0;

          padding-left: 0;
          padding-right: 0;

          overflow-x: hidden;
        }

        body {
          width: 100%;
        }

        .container {
          width: 100%;

          margin: 0;

          padding: 6px 0 22px;
        }

        .header,
        .card,
        .member-card,
        .checkin-id-card,
        .home-button,
        .error,
        .success-message {
          width: 100%;
          max-width: none;
        }

        .header-title {
          font-size: 30px;
        }

        .header-subtitle {
          font-size: 25px;
        }

        .language-button {
          min-width: 112px;
          min-height: 58px;

          font-size: 23px;
        }

        .home-button {
          min-height: 70px;

          font-size: 25px;
        }

        .checkin-id {
          font-size: 24px;
        }

        .card {
          padding-left: 10px;
          padding-right: 10px;
        }

        .member-card {
          padding-left: 12px;
          padding-right: 12px;
        }
      }

      @media (max-width: 380px) {
        .header-title {
          font-size: 30px;
        }

        .header-subtitle {
          font-size: 22px;
        }

        .language-button {
          min-width: 100px;
          min-height: 54px;

          padding-left: 15px;
          padding-right: 15px;

          font-size: 21px;
        }

        .home-button {
          min-height: 66px;

          font-size: 23px;
        }

        .checkin-id {
          font-size: 24px;
        }

        .checkin-id-label {
          font-size: 22px;
        }

        .checkin-activity-title {
          font-size: 20px;
        }

        .checkin-date {
          font-size: 21px;
        }

        .card-title {
          font-size: 26px;
        }

        label {
          font-size: 23px;
        }

        input,
        select {
          min-height: 64px;

          font-size: 22px;
        }

        button {
          min-height: 66px;

          font-size: 23px;
        }

        .activity-option {
          min-height: 78px;
        }

        .activity-option-title {
          font-size: 20px;
        }

        .activity-option-info {
          font-size: 19px;
        }

        .summary-number {
          font-size: 44px;
        }

        .summary-label {
          font-size: 20px;
        }

        .member-name {
          font-size: 30px;
        }

        .member-info {
          font-size: 21px;
        }

        .member-status {
          font-size: 19px;
        }

        .checkin-button {
          min-height: 70px;

          font-size: 25px;
        }

        .empty {
          font-size: 22px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <!-- =========================
           顶部
      ========================== -->
      <div class="header">
        <div class="language-switcher">
          <button
            type="button"
            id="langZh"
            class="language-button active"
            onclick="setLanguage('zh')"
          >
            中文
          </button>

          <span class="language-divider">|</span>

          <button
            type="button"
            id="langJa"
            class="language-button"
            onclick="setLanguage('ja')"
          >
            日本語
          </button>
        </div>

        <button
          type="button"
          class="home-button"
          onclick="goHome()"
          data-i18n="home"
        >
          🏠 返回首页
        </button>

        <h1 class="header-title" data-i18n="title">🏸 今日签到</h1>

        <div class="header-subtitle" data-i18n="subtitle">
          找到你的报名，完成签到
        </div>
      </div>

      <!-- =========================
           今日签到 ID
      ========================== -->
      <div class="checkin-id-card">
        <div class="checkin-id-label" data-i18n="todayCheckinID">
          📌 今日签到 ID
        </div>

        <div id="displayCheckinID" class="checkin-id">—</div>

        <div id="displayActivityTitle" class="checkin-activity-title">
          请先选择活动
        </div>

        <div id="displayDate" class="checkin-date"></div>
      </div>

      <!-- =========================
           活动选择
      ========================== -->
      <div class="card">
        <div class="card-title" data-i18n="selectActivity">📅 选择今日活动</div>

        <div id="todayActivityList" class="today-activity-list">
          <div class="empty" data-i18n="loading">正在读取今日活动……</div>
        </div>

        <label for="activityID" data-i18n="activityID"> 活动 / 签到 ID </label>

        <input
          id="activityID"
          type="text"
          placeholder="例如：ACT000001"
          data-i18n-placeholder="activityPlaceholder"
          autocomplete="off"
        />

        <button
          type="button"
          class="load-button"
          id="loadListButton"
          onclick="loadList()"
          data-i18n="loadList"
        >
          🔍 加载签到名单
        </button>
      </div>

      <!-- =========================
           统计
      ========================== -->
      <div class="card">
        <div class="summary">
          <div class="summary-box checked-summary">
            <div id="checkedCount" class="summary-number">0</div>

            <div class="summary-label" data-i18n="checked">已签到</div>
          </div>

          <div class="summary-box">
            <div id="totalCount" class="summary-number">0</div>

            <div class="summary-label" data-i18n="total">总人数</div>
          </div>
        </div>
      </div>

      <!-- =========================
           搜索
      ========================== -->
      <div class="card">
        <div class="card-title" data-i18n="search">🔎 搜索参加者</div>

        <input
          id="keyword"
          class="search-input"
          type="text"
          placeholder="姓名 / 联系方式"
          data-i18n-placeholder="searchPlaceholder"
          oninput="search()"
        />
      </div>

      <!-- =========================
           消息
      ========================== -->
      <div id="messageArea"></div>

      <!-- =========================
           名单
      ========================== -->
      <div id="list">
        <div class="empty" data-i18n="pleaseSelect">请先选择活动</div>
      </div>
    </div>

    <!-- =====================================================
         主程序
    ====================================================== -->

    <script>
      /* =====================================================
         GAS
      ====================================================== */

      const GAS_URL =
        "https://script.google.com/macros/s/AKfycbytMNkX7m-3KE79Izj1i4o2TucGVoJB6vAqjsl3RjTxe-bPfkKWBwHh_gg3Ag4guLgGtg/exec";

      /* =====================================================
         配置
      ====================================================== */

      const CONFIG = {
        // 活动缓存有效时间
        activityCacheTTL: 60 * 1000,

        // 活动缓存时间戳存储键
        activityCacheKey: "activities_cache_meta",

        // 请求超时
        requestTimeout: 15000,

        // 消息显示时间
        messageDuration: 3500,
      };

      /* =====================================================
         翻译
      ====================================================== */

      const I18N = {
        zh: {
          home: "🏠 返回首页",

          title: "🏸 今日签到",

          subtitle: "找到你的报名，完成签到",

          todayCheckinID: "📌 今日签到 ID",

          selectActivity: "📅 选择今日活动",

          activityID: "活动 / 签到 ID",

          activityPlaceholder: "例如：ACT000001",

          loadList: "🔍 加载签到名单",

          loadingList: "正在加载签到名单……",

          checked: "已签到",

          total: "总人数",

          search: "🔎 搜索参加者",

          searchPlaceholder: "姓名 / 联系方式",

          pleaseSelect: "请先选择活动",

          loading: "正在读取今日活动……",

          noTodayActivity: "今天没有可签到的活动",

          noMembers: "没有找到参加者",

          notChecked: "⏳ 未签到",

          checkedStatus: "✅ 已签到",

          level: "等级",

          payment: "付款方式",

          cash: "现金",

          paypay: "PayPay",

          unpaid: "未付款",

          free: "免费",

          checkin: "✅ 签到",

          checking: "正在签到……",

          checkinSuccess: "签到成功",

          loadFailed: "加载失败：",

          checkinFailed: "签到失败：",

          activityNotFound: "没有找到这个活动",

          activityLoaded: "签到名单已加载",

          today: "今天",

          members: "人",

          offlineSaved: "📴 签到已保存，网络恢复后会自动同步。",
          missingRegistrationID: "签到失败：缺少报名 ID",
          paymentMethodNotFound: "签到失败：找不到付款方式",
          requestTimeout: "服务器请求超时，请检查网络",
          noServerData: "服务器没有返回数据",
          responseFormatError: "服务器返回格式错误",
        },

        ja: {
          home: "🏠 ホームに戻る",

          title: "🏸 本日のチェックイン",

          subtitle: "参加者を確認してチェックイン",

          todayCheckinID: "📌 本日のチェックイン ID",

          selectActivity: "📅 本日のイベントを選択",

          activityID: "イベント / チェックイン ID",

          activityPlaceholder: "例：ACT000001",

          loadList: "🔍 参加者一覧を読み込む",

          loadingList: "参加者一覧を読み込んでいます……",

          checked: "チェックイン済み",

          total: "参加人数",

          search: "🔎 参加者を検索",

          searchPlaceholder: "名前 / 連絡先",

          pleaseSelect: "イベントを選択してください",

          loading: "本日のイベントを読み込んでいます……",

          noTodayActivity: "本日のチェックイン可能なイベントはありません",

          noMembers: "参加者が見つかりません",

          notChecked: "⏳ 未チェックイン",

          checkedStatus: "✅ チェックイン済み",

          level: "レベル",

          payment: "支払い方法",

          cash: "現金",

          paypay: "PayPay",

          unpaid: "未払い",

          free: "無料",

          checkin: "✅ チェックイン",

          checking: "チェックイン中……",

          checkinSuccess: "チェックインしました",

          loadFailed: "読み込み失敗：",

          checkinFailed: "チェックイン失敗：",

          activityNotFound: "イベントが見つかりません",

          activityLoaded: "参加者一覧を読み込みました",

          today: "本日",

          members: "人",

          offlineSaved:
            "📴 チェックインを保存しました。通信復旧後に自動同期します。",
          missingRegistrationID: "チェックイン失敗：参加 ID がありません",
          paymentMethodNotFound: "チェックイン失敗：支払い方法が見つかりません",
          requestTimeout:
            "サーバーへの接続がタイムアウトしました。通信状態を確認してください",
          noServerData: "サーバーからデータが返されませんでした",
          responseFormatError: "サーバーの応答形式が正しくありません",
        },
      };

      /* =====================================================
         状态
      ====================================================== */

      let currentLanguage = localStorage.getItem("language") || "zh";

      let members = [];

      let allTodayActivities = [];

      let currentActivityID = "";

      let activityLoadingPromise = null;

      let listLoadingPromise = null;

      let currentListRequestID = 0;

      let currentActivityRequestID = 0;

      let syncRunning = false;

      /* =====================================================
         DOM
      ====================================================== */

      const $ = (id) => document.getElementById(id);

      /* =====================================================
         翻译
      ====================================================== */

      function t(key) {
        return I18N[currentLanguage]?.[key] ?? I18N.zh[key] ?? key;
      }

      function applyLanguage() {
        document.querySelectorAll("[data-i18n]").forEach((el) => {
          const key = el.dataset.i18n;

          if (I18N[currentLanguage]?.[key] !== undefined) {
            el.textContent = I18N[currentLanguage][key];
          }
        });

        document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => {
          const key = el.dataset.i18nPlaceholder;

          if (I18N[currentLanguage]?.[key] !== undefined) {
            el.placeholder = I18N[currentLanguage][key];
          }
        });

        $("langZh").classList.toggle("active", currentLanguage === "zh");

        $("langJa").classList.toggle("active", currentLanguage === "ja");
      }

      function setLanguage(lang) {
        currentLanguage = I18N[lang] ? lang : "zh";

        localStorage.setItem("language", currentLanguage);

        applyLanguage();

        renderTodayActivities(allTodayActivities);

        if (members.length) {
          render(filterMembers());
        }
      }

      /* =====================================================
         首页
      ====================================================== */

      function goHome() {
        window.location.href = "./index.html";
      }

      /* =====================================================
         初始化
      ====================================================== */

      window.addEventListener("DOMContentLoaded", () => {
        applyLanguage();
        initializeCheckin();

        setTimeout(() => {
          processSyncQueue();
        }, 500);
      });

      async function initializeCheckin() {
        const params = new URLSearchParams(window.location.search);

        const preferredActivityID = params.get("activityID") || "";

        await loadTodayActivities(preferredActivityID);
      }

      /* =====================================================
         今日活动
      ====================================================== */

      async function getActivityCacheMeta() {
        try {
          return await dbGet("settings", CONFIG.activityCacheKey);
        } catch (error) {
          console.warn("[CHECKIN] 活动缓存元数据读取失败:", error);
          return null;
        }
      }

      async function setActivityCacheMeta() {
        try {
          await dbPut("settings", {
            key: CONFIG.activityCacheKey,
            updatedAt: Date.now(),
          });
        } catch (error) {
          console.warn("[CHECKIN] 活动缓存元数据保存失败:", error);
        }
      }

      function isActivityCacheFresh(meta) {
        const updatedAt = Number(meta?.updatedAt || 0);
        return (
          updatedAt > 0 && Date.now() - updatedAt < CONFIG.activityCacheTTL
        );
      }

      async function loadTodayActivities(preferredActivityID = "") {
        // 防止重复调用
        if (activityLoadingPromise) {
          return activityLoadingPromise;
        }

        activityLoadingPromise =
          loadTodayActivitiesInternal(preferredActivityID);

        try {
          return await activityLoadingPromise;
        } finally {
          activityLoadingPromise = null;
        }
      }

      async function loadTodayActivitiesInternal(preferredActivityID = "") {
        const box = $("todayActivityList");

        const today = getTodayString();

        box.innerHTML = `
          <div class="empty">
            ${escapeHtml(t("loading"))}
          </div>
        `;

        let cachedActivities = [];

        /* ---------------------------------------------
           1. 读取本地缓存
        --------------------------------------------- */

        try {
          cachedActivities = await dbGetAll("activities");
        } catch (error) {
          console.warn("[CHECKIN] IndexedDB activities 读取失败:", error);
        }

        const cachedToday = filterTodayActivities(cachedActivities, today);

        if (cachedToday.length) {
          console.log("[CHECKIN] 使用本地活动缓存:", cachedToday);

          allTodayActivities = cachedToday;

          renderTodayActivities(cachedToday);

          // 有明确 URL activityID
          if (preferredActivityID && findActivity(preferredActivityID)) {
            await selectActivity(preferredActivityID, {
              autoLoad: true,
            });
          }

          // 只有一个活动
          else if (cachedToday.length === 1 && !currentActivityID) {
            await selectActivity(cachedToday[0].ActivityID, {
              autoLoad: true,
            });
          }
        }

        /* ---------------------------------------------
           2. 网络刷新
        --------------------------------------------- */

        if (!navigator.onLine) {
          if (!cachedToday.length) {
            box.innerHTML = `
              <div class="empty">
                ${escapeHtml(t("noTodayActivity"))}
              </div>
            `;
          }

          return;
        }

        const activityCacheMeta = await getActivityCacheMeta();
        const cacheFresh = isActivityCacheFresh(activityCacheMeta);

        if (cachedToday.length && cacheFresh && !preferredActivityID) {
          console.log("[CHECKIN] 活动缓存仍有效，跳过本次网络刷新");
          return;
        }

        try {
          const activities = await gasRequest(
            {
              action: "pwaCheckin",
              type: "getActivities",
            },
            {
              timeout: CONFIG.requestTimeout,
            },
          );

          if (!Array.isArray(activities)) {
            throw new Error("活动数据格式错误");
          }

          /* ---------------------------------------------
             保存缓存
          --------------------------------------------- */

          try {
            await dbPutAll("activities", activities);
            await setActivityCacheMeta();
          } catch (cacheError) {
            console.warn("[CHECKIN] 活动缓存保存失败:", cacheError);
          }

          const freshToday = filterTodayActivities(activities, today);

          const oldIDs = getActivityIDs(allTodayActivities);

          const newIDs = getActivityIDs(freshToday);

          const activitiesChanged = !sameArray(oldIDs, newIDs);

          allTodayActivities = freshToday;

          renderTodayActivities(freshToday);

          if (!freshToday.length) {
            box.innerHTML = `
              <div class="empty">
                📅 ${escapeHtml(t("noTodayActivity"))}
              </div>
            `;

            return;
          }

          /* ---------------------------------------------
             关键优化：

             如果缓存阶段已经自动选择过同一个活动，
             网络刷新后绝对不要再次 loadList()
          --------------------------------------------- */

          let targetActivityID = preferredActivityID || currentActivityID;

          if (!targetActivityID && freshToday.length === 1) {
            targetActivityID = freshToday[0].ActivityID;
          }

          if (targetActivityID && findActivity(targetActivityID)) {
            const alreadySelected =
              String(currentActivityID) === String(targetActivityID);

            if (!alreadySelected) {
              await selectActivity(targetActivityID, {
                autoLoad: true,
              });
            } else {
              updateActivityHeader();
            }
          }

          console.log("[CHECKIN] 今日活动刷新完成", {
            changed: activitiesChanged,
            count: freshToday.length,
          });
        } catch (error) {
          console.error("[CHECKIN] 今日活动网络刷新失败:", error);

          // 有缓存就继续使用缓存
          if (cachedToday.length) {
            console.log("[CHECKIN] 网络失败，继续使用缓存");

            return;
          }

          box.innerHTML = `
            <div class="error">
              ⚠️
              ${escapeHtml(t("loadFailed"))}
              ${escapeHtml(error?.message || String(error))}
            </div>
          `;
        }
      }

      function filterTodayActivities(activities, today) {
        if (!Array.isArray(activities)) {
          return [];
        }

        return activities.filter((activity) => {
          return String(activity.Date || "").substring(0, 10) === today;
        });
      }

      function getActivityIDs(activities) {
        return (activities || [])
          .map((activity) => String(activity.ActivityID || ""))
          .sort();
      }

      function sameArray(a, b) {
        if (a.length !== b.length) {
          return false;
        }

        return a.every((value, index) => value === b[index]);
      }

      function renderTodayActivities(list) {
        const box = $("todayActivityList");

        box.innerHTML = "";

        if (!list?.length) {
          box.innerHTML = `
            <div class="empty">
              📅 ${escapeHtml(t("noTodayActivity"))}
            </div>
          `;

          return;
        }

        const fragment = document.createDocumentFragment();

        list.forEach((activity) => {
          const button = document.createElement("button");

          button.type = "button";

          button.className = "activity-option";

          if (String(activity.ActivityID) === String(currentActivityID)) {
            button.classList.add("active");
          }

          const title = activity.Title || "🏸";

          const date = formatDate(activity.ActivityDate || activity.Date);

          const time = activity.StartTime
            ? `　⏰ ${escapeHtml(activity.StartTime)}`
            : "";

          const end = activity.EndTime
            ? ` - ${escapeHtml(activity.EndTime)}`
            : "";

          button.innerHTML = `

              <div class="activity-option-title">
                🏸 ${escapeHtml(title)}
              </div>

              <div class="activity-option-info">

                📅 ${escapeHtml(date)}

                ${time}${end}

                <br>

                🆔 ${escapeHtml(activity.ActivityID || "")}

              </div>

            `;

          button.onclick = () =>
            selectActivity(activity.ActivityID, {
              autoLoad: true,
            });

          fragment.appendChild(button);
        });

        box.appendChild(fragment);
      }

      /* =====================================================
         选择活动
      ====================================================== */

      async function selectActivity(activityID, options = {}) {
        const id = String(activityID || "").trim();

        if (!id) {
          return;
        }

        const changed = currentActivityID !== id;

        currentActivityID = id;

        $("activityID").value = id;

        $("displayCheckinID").textContent = id;

        updateActivityHeader();

        renderTodayActivities(allTodayActivities);

        if (options.autoLoad && (changed || members.length === 0)) {
          await loadList(id, {
            force: false,
          });
        }
      }

      function findActivity(activityID) {
        return (
          allTodayActivities.find(
            (activity) => String(activity.ActivityID) === String(activityID),
          ) || null
        );
      }

      function updateActivityHeader() {
        const activity = findActivity(currentActivityID);

        if (!activity) {
          $("displayActivityTitle").textContent =
            currentLanguage === "ja"
              ? "イベントを選択してください"
              : "请先选择活动";

          $("displayDate").textContent = "";

          return;
        }

        $("displayActivityTitle").textContent = "🏸 " + (activity.Title || "");

        const fee = Number(activity.Fee || 0);

        const feeText =
          currentLanguage === "ja"
            ? "参加費：" + fee + "円"
            : "参加费：" + fee + "日元";

        $("displayDate").textContent =
          "📅 " +
          formatDate(activity.ActivityDate || activity.Date) +
          "　💰 " +
          feeText;
      }

      /* =====================================================
         签到名单
      ====================================================== */

      async function loadList(forcedID = "", options = {}) {
        const id = String(forcedID || $("activityID").value || "").trim();

        if (!id) {
          showMessage(t("activityNotFound"), true);

          return;
        }

        currentActivityID = id;

        $("activityID").value = id;

        $("displayCheckinID").textContent = id;

        updateActivityHeader();

        /* ---------------------------------------------
           防止同一个 ID 同时发多个请求
        --------------------------------------------- */

        if (listLoadingPromise && listLoadingPromise.activityID === id) {
          return listLoadingPromise.promise;
        }

        const requestID = ++currentListRequestID;

        const promise = loadListInternal(id, requestID, options);

        listLoadingPromise = {
          activityID: id,
          promise,
        };

        try {
          return await promise;
        } finally {
          if (listLoadingPromise?.promise === promise) {
            listLoadingPromise = null;
          }
        }
      }

      async function loadListInternal(id, requestID, options = {}) {
        const cacheKey = "checkinList_" + id;

        /* ---------------------------------------------
           1. 先读取本地缓存
        --------------------------------------------- */

        let cachedMembers = null;

        try {
          const cached = await dbGet("settings", cacheKey);

          if (cached && Array.isArray(cached.value)) {
            cachedMembers = cached.value;
          }
        } catch (error) {
          console.warn("[CHECKIN] 本地签到名单读取失败:", error);
        }

        if (requestID !== currentListRequestID) {
          return;
        }

        if (cachedMembers) {
          members = cachedMembers;

          updateSummary();

          render(filterMembers());

          updateActivityHeader();
        } else {
          $("list").innerHTML = `
            <div class="empty">
              ${escapeHtml(t("loadingList"))}
            </div>
          `;
        }

        /* ---------------------------------------------
           2. 离线
        --------------------------------------------- */

        if (!navigator.onLine) {
          return;
        }

        /* ---------------------------------------------
           3. 请求服务器
        --------------------------------------------- */

        try {
          const res = await gasRequest(
            {
              action: "pwaCheckin",

              type: "getCheckinList",

              activityID: id,
            },
            {
              timeout: CONFIG.requestTimeout,
            },
          );

          if (requestID !== currentListRequestID) {
            return;
          }

          if (!res?.success) {
            // 如果本地有缓存，
            // 网络失败时不要把缓存清掉
            if (cachedMembers) {
              console.warn("[CHECKIN] 服务器返回失败，继续使用缓存", res);

              return;
            }

            members = [];

            updateSummary();

            $("list").innerHTML = `
              <div class="error">
                ❌
                ${escapeHtml(res?.message || t("activityNotFound"))}
              </div>
            `;

            return;
          }

          const freshMembers = Array.isArray(res.data) ? res.data : [];

          members = freshMembers;

          /* ---------------------------------------------
             4. 保存缓存
          --------------------------------------------- */

          try {
            await dbPut("settings", {
              key: cacheKey,

              value: freshMembers,

              updatedAt: new Date().toISOString(),
            });
          } catch (cacheError) {
            console.warn("[CHECKIN] 签到名单缓存保存失败:", cacheError);
          }

          updateSummary();

          render(filterMembers());

          updateActivityHeader();

          console.log("[CHECKIN] 签到名单加载完成:", id, freshMembers.length);
        } catch (error) {
          console.error("[CHECKIN] loadList error:", error);

          if (cachedMembers) {
            // 有缓存就不要把页面变成错误
            return;
          }

          $("list").innerHTML = `
            <div class="error">
              ❌
              ${escapeHtml(t("loadFailed"))}
              ${escapeHtml(error?.message || String(error))}
            </div>
          `;
        }
      }

      /* =====================================================
         搜索
      ====================================================== */

      function search() {
        render(filterMembers());
      }

      function filterMembers() {
        const keyword = $("keyword").value.trim().toLowerCase();

        if (!keyword) {
          return members;
        }

        return members.filter((member) => {
          const name = String(member.Name || "").toLowerCase();

          const contact = String(member.ContactValue || "").toLowerCase();

          return name.includes(keyword) || contact.includes(keyword);
        });
      }

      /* =====================================================
         显示名单
      ====================================================== */

      function render(data) {
        const box = $("list");

        box.innerHTML = "";

        if (!data?.length) {
          box.innerHTML = `
            <div class="empty">
              👤 ${escapeHtml(t("noMembers"))}
            </div>
          `;

          return;
        }

        const fragment = document.createDocumentFragment();

        data.forEach((member) => {
          fragment.appendChild(createMemberCard(member));
        });

        box.appendChild(fragment);
      }

      function createMemberCard(member) {
        const div = document.createElement("div");

        const checked = Boolean(member.CheckedIn);

        div.className = "member-card" + (checked ? " checked" : "");

        div.innerHTML = `

          <div class="member-name">

            ${escapeHtml(member.Name || "")}

          </div>

          <div class="member-info">

            ${escapeHtml(t("level"))}：

            ${escapeHtml(member.Level || "-")}

          </div>

          <div
            class="member-status ${checked ? "status-checked" : "status-not"}"
          >

            ${escapeHtml(checked ? t("checkedStatus") : t("notChecked"))}

          </div>

        `;

        if (checked) {
          div.insertAdjacentHTML(
            "beforeend",
            `

              <div class="member-info">

                ${escapeHtml(t("payment"))}：

                ${escapeHtml(paymentText(member.PaymentMethod))}

              </div>

            `,
          );

          return div;
        }

        const registrationID = String(member.RegistrationID || "");

        const select = document.createElement("select");

        select.id = `pay_${registrationID}`;

        select.className = "payment-select";

        select.innerHTML = `

          <option value="CASH">

            ${escapeHtml(t("cash"))}

          </option>

          <option value="PAYPAY">

            ${escapeHtml(t("paypay"))}

          </option>

          <option value="UNPAID">

            ${escapeHtml(t("unpaid"))}

          </option>

          <option value="FREE">

            ${escapeHtml(t("free"))}

          </option>

        `;

        const button = document.createElement("button");

        button.type = "button";

        button.className = "checkin-button";

        button.textContent = t("checkin");

        button.addEventListener("click", async () => {
          await checkin(registrationID, button);
        });

        div.appendChild(select);

        div.appendChild(button);

        return div;
      }

      /* =====================================================
         付款方式
      ====================================================== */

      function paymentText(payment) {
        const value = String(payment || "").toUpperCase();

        const map = {
          CASH: "cash",

          PAYPAY: "paypay",

          FREE: "free",

          UNPAID: "unpaid",
        };

        return map[value] ? t(map[value]) : payment || "-";
      }

      /* =====================================================
         签到
      ====================================================== */

      async function checkin(registrationID, button = null) {
        if (!registrationID) {
          showMessage(t("missingRegistrationID"), true);

          return;
        }

        const select = $(`pay_${registrationID}`);

        if (!select) {
          showMessage(t("paymentMethodNotFound"), true);

          return;
        }

        const payment = select.value || "UNPAID";

        // 防止用户连续快速点击
        if (button?.dataset.busy === "1") {
          return;
        }

        if (button) {
          button.dataset.busy = "1";

          button.disabled = true;

          button.classList.add("loading");

          button.textContent = t("checking");
        }

        const clientRequestID =
          "CHECKIN-" +
          Date.now() +
          "-" +
          Math.random().toString(36).substring(2, 10);

        try {
          /* ---------------------------------------------
             离线签到
          --------------------------------------------- */

          if (!navigator.onLine) {
            await addSyncTask({
              action: "checkin",

              data: {
                action: "pwaCheckin",

                type: "checkin",

                registrationID,

                paymentMethod: payment,

                clientRequestID,
              },
            });

            await updateLocalMemberAfterCheckin(
              registrationID,
              payment,
              clientRequestID,
              "PENDING",
            );

            showMessage(t("offlineSaved"), false);

            return;
          }

          /* ---------------------------------------------
             在线签到
          --------------------------------------------- */

          const res = await gasRequest(
            {
              action: "pwaCheckin",

              type: "checkin",

              registrationID,

              paymentMethod: payment,

              clientRequestID,
            },
            {
              timeout: CONFIG.requestTimeout,
            },
          );

          if (res?.success === false) {
            showMessage(res.message || t("checkinFailed"), true);

            return;
          }

          /* ---------------------------------------------
             关键优化：

             成功以后直接更新本地会员，
             不再调用 loadList()
          --------------------------------------------- */

          await updateLocalMemberAfterCheckin(
            registrationID,
            payment,
            clientRequestID,
            "SYNCED",
          );

          showMessage("✅ " + (res?.message || t("checkinSuccess")), false);
        } catch (error) {
          console.error("[CHECKIN] 签到异常:", error);

          showMessage(
            t("checkinFailed") + " " + (error?.message || String(error)),
            true,
          );
        } finally {
          if (button) {
            button.dataset.busy = "0";

            button.disabled = false;

            button.classList.remove("loading");

            button.textContent = t("checkin");
          }
        }
      }

      /* =====================================================
         本地立即更新签到状态
      ====================================================== */

      async function updateLocalMemberAfterCheckin(
        registrationID,
        payment,
        clientRequestID,
        status,
      ) {
        const member = members.find(
          (item) => String(item.RegistrationID) === String(registrationID),
        );

        if (!member) {
          return;
        }

        member.CheckedIn = true;

        member.PaymentMethod = payment;

        member.ClientRequestID = clientRequestID;

        member.CheckinStatus = status;

        member.CheckedInAt = new Date().toISOString();

        try {
          await dbPut("settings", {
            key: "checkinList_" + currentActivityID,

            value: members,

            updatedAt: new Date().toISOString(),
          });
        } catch (error) {
          console.warn("[CHECKIN] 本地签到状态保存失败:", error);
        }

        updateSummary();

        render(filterMembers());
      }

      /* =====================================================
         网络请求

         统一处理：
         - timeout
         - JSON
         - 302 redirect
         - HTTP 错误
      ====================================================== */

      async function gasRequest(payload, options = {}) {
        const timeout = options.timeout || CONFIG.requestTimeout;

        const controller = new AbortController();

        const timeoutID = setTimeout(() => {
          controller.abort();
        }, timeout);

        try {
          const response = await fetch(GAS_URL, {
            method: "POST",

            body: JSON.stringify(payload),

            signal: controller.signal,

            redirect: "follow",
          });

          if (!response.ok) {
            throw new Error("HTTP " + response.status);
          }

          const text = await response.text();

          if (!text) {
            throw new Error(t("noServerData"));
          }

          try {
            return JSON.parse(text);
          } catch (jsonError) {
            console.error("[GAS] 原始返回:", text);

            throw new Error(t("responseFormatError"));
          }
        } catch (error) {
          if (error?.name === "AbortError") {
            throw new Error(t("requestTimeout"));
          }

          throw error;
        } finally {
          clearTimeout(timeoutID);
        }
      }

      /* =====================================================
         离线同步队列

         只保留一套同步逻辑
      ====================================================== */

      async function processSyncQueue() {
        if (syncRunning) {
          console.log("[SYNC] 已经在同步，跳过重复执行");

          return;
        }

        if (!navigator.onLine) {
          return;
        }

        syncRunning = true;

        try {
          const queue = await getSyncQueue();

          if (!queue || queue.length === 0) {
            return;
          }

          console.log("[SYNC] 待同步任务:", queue.length);

          for (const task of queue) {
            if (!task || task.action !== "checkin") {
              continue;
            }

            try {
              console.log("[SYNC] 同步:", task.id);

              const result = await gasRequest(task.data, {
                timeout: CONFIG.requestTimeout,
              });

              if (result?.success === false) {
                // 已经签到：
                // 服务器实际上已经完成
                if (result.message === "已经签到") {
                  await removeSyncTask(task.id);

                  continue;
                }

                console.warn("[SYNC] 服务器拒绝任务:", result.message);

                // 当前任务失败，
                // 不继续疯狂请求后面的任务
                break;
              }

              await removeSyncTask(task.id);

              console.log("[SYNC] 同步成功:", task.id);
            } catch (error) {
              console.error("[SYNC] 同步失败:", task.id, error);

              // 网络失败：
              // 停止本轮，等下一次网络恢复
              break;
            }
          }
        } catch (error) {
          console.error("[SYNC] 读取同步队列失败:", error);
        } finally {
          syncRunning = false;
        }
      }

      /* =====================================================
         网络恢复
      ====================================================== */

      window.addEventListener("online", () => {
        console.log("[SYNC] 网络恢复");

        processSyncQueue();
      });

      /* =====================================================
         页面启动后：

         不立即做同步网络请求，
         只读取队列。
      ====================================================== */

      /* =====================================================
         统计
      ====================================================== */

      function updateSummary() {
        const checked = members.filter((member) =>
          Boolean(member.CheckedIn),
        ).length;

        $("checkedCount").textContent = checked;

        $("totalCount").textContent = members.length;
      }

      /* =====================================================
         消息
      ====================================================== */

      let messageTimer = null;

      function showMessage(message, isError) {
        const box = $("messageArea");

        if (messageTimer) {
          clearTimeout(messageTimer);
        }

        box.innerHTML = `

          <div
            class="${isError ? "error" : "success-message"}"
          >

            ${escapeHtml(message)}

          </div>

        `;

        messageTimer = setTimeout(() => {
          box.innerHTML = "";
        }, CONFIG.messageDuration);
      }

      /* =====================================================
         日期
      ====================================================== */

      function getTodayString() {
        const date = new Date();

        return [
          date.getFullYear(),

          String(date.getMonth() + 1).padStart(2, "0"),

          String(date.getDate()).padStart(2, "0"),
        ].join("-");
      }

      function formatDate(value) {
        if (!value) {
          return "";
        }

        const raw = String(value).trim();

        // 纯 YYYY-MM-DD 不经过 new Date，避免 UTC 时区导致日期偏移。
        if (/^\d{4}-\d{2}-\d{2}$/.test(raw)) {
          return raw;
        }

        const date = new Date(raw);

        if (isNaN(date.getTime())) {
          return raw.substring(0, 10);
        }

        return [
          date.getFullYear(),
          String(date.getMonth() + 1).padStart(2, "0"),
          String(date.getDate()).padStart(2, "0"),
        ].join("-");
      }

      /* =====================================================
         安全处理
      ====================================================== */

      function escapeHtml(value) {
        if (value === null || value === undefined) {
          return "";
        }

        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }
    </script>
