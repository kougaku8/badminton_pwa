<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    />

    <meta name="theme-color" content="#1677ff" />

    <link rel="manifest" href="./manifest.json" />
    <link rel="stylesheet" href="./style.css" />
    <script src="./db.js"></script>

    <title>活动报名 / イベント申込</title>

    <style>
      /* =====================================================
       Registration Page
       V7 操作结构移植到 PWA
    ===================================================== */

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        width: 100%;
        max-width: 100%;
        min-width: 0;

        margin: 0;
        padding: 0;

        overflow-x: hidden;

        background: linear-gradient(180deg, #eef7ff 0%, #f7f9fc 100%);

        color: #1f2937;

        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei",
          "Hiragino Sans GB", "Yu Gothic", Meiryo, Arial, sans-serif;

        -webkit-font-smoothing: antialiased;
        -webkit-text-size-adjust: 100%;
      }

      body {
        min-height: 100dvh;

        padding-top: env(safe-area-inset-top);

        padding-bottom: env(safe-area-inset-bottom);
      }

      /* =====================================================
       顶部工具栏
    ===================================================== */

      .top-tools {
        position: fixed;

        top: max(8px, env(safe-area-inset-top));

        right: 8px;

        z-index: 1000;

        display: flex;

        align-items: center;

        gap: 6px;
      }

      .tool-btn {
        border: 1px solid #dbe5f0;

        background: rgba(255, 255, 255, 0.96);

        color: #334155;

        padding: 8px 11px;

        border-radius: 10px;

        font-size: 15px;
        font-weight: 700;

        cursor: pointer;

        box-shadow: 0 4px 14px rgba(15, 23, 42, 0.1);
      }

      .language-btn {
        color: #1677ff;

        border-color: #b6d7ff;
      }

      /* =====================================================
       页面主体
    ===================================================== */

      .container {
        width: 100%;
        max-width: none;

        margin: 0;

        padding: max(65px, calc(env(safe-area-inset-top) + 55px)) 8px
          max(24px, env(safe-area-inset-bottom));
      }

      /* =====================================================
       页面标题
    ===================================================== */

      .page-header {
        width: 100%;

        text-align: center;

        padding: 14px 4px 20px;
      }

      .page-icon {
        width: 62px;
        height: 62px;

        margin: 0 auto 10px;

        display: flex;

        align-items: center;
        justify-content: center;

        border-radius: 18px;

        background: linear-gradient(135deg, #1677ff, #4096ff);

        color: white;

        font-size: 32px;

        box-shadow: 0 7px 20px rgba(22, 119, 255, 0.2);
      }

      .page-title {
        margin: 0;

        font-size: 30px;

        line-height: 1.3;

        font-weight: 900;

        color: #111827;
      }

      .page-subtitle {
        margin-top: 6px;

        font-size: 16px;

        line-height: 1.4;

        color: #6b7280;
      }

      /* =====================================================
       消息
    ===================================================== */

      .message {
        display: none;

        width: 100%;

        padding: 12px;

        margin-bottom: 10px;

        border-radius: 10px;

        font-size: 15px;

        line-height: 1.5;

        font-weight: 700;
      }

      .message.success {
        display: block;

        background: #f0fff4;

        color: #237804;

        border: 1px solid #b7eb8f;
      }

      .message.error {
        display: block;

        background: #fff2f0;

        color: #cf1322;

        border: 1px solid #ffccc7;
      }

      .message.warning {
        display: block;

        background: #fffbe6;

        color: #ad6800;

        border: 1px solid #ffe58f;
      }

      /* =====================================================
       Card
    ===================================================== */

      .card {
        width: 100%;

        background: rgba(255, 255, 255, 0.97);

        border-radius: 14px;

        padding: 16px 10px;

        margin-bottom: 10px;

        border: 1px solid #e2e8f0;

        box-shadow: 0 3px 14px rgba(15, 23, 42, 0.06);
      }

      .card-title {
        display: flex;

        align-items: center;

        gap: 9px;

        font-size: 21px;

        line-height: 1.3;

        font-weight: 900;

        margin-bottom: 14px;

        color: #111827;
      }

      .section-number {
        width: 34px;
        height: 34px;

        flex: 0 0 34px;

        display: flex;

        align-items: center;
        justify-content: center;

        border-radius: 9px;

        background: #eaf3ff;

        color: #1677ff;

        font-size: 18px;

        font-weight: 900;
      }

      /* =====================================================
       表单
    ===================================================== */

      .form-group {
        margin-bottom: 14px;
      }

      .form-group:last-child {
        margin-bottom: 0;
      }

      .form-group label {
        display: block;

        margin-bottom: 6px;

        font-size: 16px;

        line-height: 1.4;

        font-weight: 800;

        color: #374151;
      }

      input,
      select,
      textarea {
        display: block;

        width: 100%;

        border: 2px solid #d5dbe3;

        border-radius: 10px;

        padding: 10px 12px;

        font-size: 16px;

        line-height: 1.4;

        color: #111827;

        background: #fff;

        outline: none;

        font-family: inherit;
      }

      input,
      select {
        min-height: 50px;
      }

      textarea {
        min-height: 110px;

        resize: vertical;
      }

      input::placeholder,
      textarea::placeholder {
        color: #9ca3af;
      }

      input:focus,
      select:focus,
      textarea:focus {
        border-color: #1677ff;

        box-shadow: 0 0 0 3px rgba(22, 119, 255, 0.1);
      }

      /* =====================================================
       报名人提示
    ===================================================== */

      .booker-tip {
        margin-top: 8px;

        padding: 9px 10px;

        border-radius: 9px;

        background: #f5f9ff;

        color: #52719b;

        font-size: 13px;

        line-height: 1.5;
      }

      /* =====================================================
       Level说明
    ===================================================== */

      .level-description {
        margin-top: 7px;

        padding: 8px 10px;

        border-radius: 9px;

        background: #f5f9ff;

        border: 1px solid #d6e8ff;

        color: #52719b;

        font-size: 12px;

        line-height: 1.5;
      }

      .level-description:empty {
        display: none;
      }

      /* =====================================================
       ① 活动列表
       V7：两列
    ===================================================== */

      .activity-list {
        display: grid;

        grid-template-columns: repeat(2, minmax(0, 1fr));

        gap: 8px;
      }

      .activity-item {
        position: relative;

        width: 100%;

        border: 2px solid #e1e6ed;

        border-radius: 11px;

        padding: 10px;

        cursor: pointer;

        background: #fff;

        transition: 0.2s;
      }

      .activity-item.selected {
        border-color: #1677ff;

        background: #f2f8ff;

        box-shadow: 0 3px 10px rgba(22, 119, 255, 0.08);
      }

      .activity-top {
        display: flex;

        align-items: flex-start;

        gap: 8px;
      }

      .activity-checkbox {
        width: 24px;
        height: 24px;

        min-width: 24px;

        margin-top: 2px;

        accent-color: #1677ff;
      }

      .activity-title {
        min-width: 0;

        font-size: 15px;

        line-height: 1.4;

        font-weight: 900;

        color: #111827;

        word-break: break-word;
      }

      .activity-info {
        margin-top: 6px;

        padding-left: 32px;

        font-size: 13px;

        line-height: 1.5;

        color: #667085;

        word-break: break-word;
      }

      .activity-info-row {
        margin-bottom: 1px;
      }

      .selected-summary {
        margin-top: 10px;

        padding: 9px;

        border-radius: 9px;

        background: #f5f7fa;

        color: #475467;

        font-size: 14px;

        line-height: 1.5;
      }

      /* =====================================================
       ③ 参加人员
    ===================================================== */

      .participant {
        width: 100%;

        border: 2px solid #e4e8ee;

        border-radius: 11px;

        padding: 11px;

        margin-bottom: 10px;

        background: linear-gradient(180deg, #ffffff, #fafcff);
      }

      .participant.first {
        border-color: #b6d7ff;

        background: linear-gradient(180deg, #f7fbff, #ffffff);
      }

      .participant-header {
        display: flex;

        align-items: center;

        justify-content: space-between;

        gap: 8px;

        margin-bottom: 10px;
      }

      .participant-title-wrap {
        display: flex;

        align-items: center;

        gap: 7px;
      }

      .participant-badge {
        width: 30px;
        height: 30px;

        display: flex;

        align-items: center;
        justify-content: center;

        border-radius: 8px;

        background: #1677ff;

        color: white;

        font-size: 15px;

        font-weight: 900;
      }

      .participant-title {
        font-size: 17px;

        font-weight: 900;

        color: #111827;
      }

      .participant-main {
        padding: 9px;

        margin-bottom: 10px;

        border-radius: 8px;

        background: #f5f9ff;

        color: #52719b;

        font-size: 12px;

        line-height: 1.5;
      }

      .participant-grid {
        display: grid;

        grid-template-columns: repeat(2, minmax(0, 1fr));

        gap: 9px;
      }

      .full-width {
        grid-column: 1 / -1;
      }

      /* =====================================================
       删除按钮
    ===================================================== */

      .remove-btn {
        border: none;

        background: #fff1f0;

        color: #cf1322;

        padding: 7px 9px;

        border-radius: 8px;

        cursor: pointer;

        font-size: 13px;

        font-weight: 800;

        white-space: nowrap;
      }

      /* =====================================================
       添加按钮
    ===================================================== */

      .add-btn {
        width: 100%;

        border: 2px dashed #91caff;

        background: #f5f9ff;

        color: #1677ff;

        padding: 11px;

        border-radius: 10px;

        font-size: 16px;

        font-weight: 800;

        cursor: pointer;
      }

      /* =====================================================
       提交按钮
    ===================================================== */

      .submit-btn {
        width: 100%;

        border: none;

        border-radius: 12px;

        background: linear-gradient(135deg, #1677ff, #4096ff);

        color: #fff;

        padding: 14px;

        min-height: 58px;

        font-size: 19px;

        line-height: 1.35;

        font-weight: 900;

        cursor: pointer;

        box-shadow: 0 6px 16px rgba(22, 119, 255, 0.2);
      }

      .submit-btn:disabled {
        background: #aeb8c4;

        box-shadow: none;

        cursor: not-allowed;
      }

      /* =====================================================
       Loading
    ===================================================== */

      .loading {
        display: none;

        text-align: center;

        color: #667085;

        padding-top: 10px;

        font-size: 14px;
      }

      /* =====================================================
       结果
    ===================================================== */

      .result-box {
        margin-top: 5px;

        padding: 5px;

        border-radius: 9px;

        background: #f7f8fa;

        font-size: 14px;

        line-height: 1.5;
      }

      .result-item {
        border-bottom: 1px solid #e5e7eb;

        padding: 10px 6px;
      }

      .result-item:last-child {
        border-bottom: none;
      }

      .status-confirmed {
        color: #389e0d;

        font-weight: 900;
      }

      .status-waitlist {
        color: #d48806;

        font-weight: 900;
      }

      .status-failed {
        color: #cf1322;

        font-weight: 900;
      }

      /* =====================================================
       空状态
    ===================================================== */

      .empty {
        width: 100%;

        color: #98a2b3;

        text-align: center;

        padding: 25px 10px;

        font-size: 14px;

        line-height: 1.5;
      }

      /* =====================================================
       小屏幕
    ===================================================== */

      @media (max-width: 600px) {
        .container {
          padding-left: 7px;
          padding-right: 7px;
        }

        .page-title {
          font-size: 24px;
        }

        .page-subtitle {
          font-size: 14px;
        }

        .card {
          padding: 14px 8px;
        }

        .card-title {
          font-size: 19px;
        }

        .section-number {
          width: 31px;
          height: 31px;

          flex-basis: 31px;

          font-size: 16px;
        }

        .activity-title {
          font-size: 14px;
        }

        .activity-info {
          font-size: 12px;

          padding-left: 32px;
        }

        .selected-summary {
          font-size: 13px;
        }

        .participant-grid {
          grid-template-columns: 1fr;
        }

        .full-width {
          grid-column: auto;
        }

        .form-group label {
          font-size: 15px;
        }

        input,
        select,
        textarea {
          font-size: 15px;
        }

        .add-btn {
          font-size: 15px;
        }

        .submit-btn {
          font-size: 18px;
        }
      }

      @media (max-width: 380px) {
        .activity-list {
          grid-template-columns: 1fr;
        }

        .page-title {
          font-size: 22px;
        }

        .page-subtitle {
          font-size: 13px;
        }

        .activity-title {
          font-size: 14px;
        }

        .activity-info {
          font-size: 12px;
        }
      }
    </style>
  </head>

  <body>
    <!-- =====================================================
       顶部工具
  ===================================================== -->

    <div class="top-tools">
      <button type="button" class="tool-btn" id="homeBtn" onclick="goHome()">
        ← 返回主页
      </button>

      <button
        type="button"
        class="tool-btn language-btn"
        id="languageBtn"
        onclick="toggleLanguage()"
      >
        日本語
      </button>
    </div>

    <div class="container">
      <!-- =====================================================
         页面标题
    ===================================================== -->

      <div class="page-header">
        <div class="page-icon">🏸</div>

        <h1 class="page-title" data-i18n="pageTitle">活动报名</h1>

        <div class="page-subtitle" data-i18n="pageSubtitle">
          请选择活动并填写参加人员
        </div>
      </div>

      <!-- =====================================================
         消息
    ===================================================== -->

      <div id="messageBox" class="message"></div>

      <!-- =====================================================
         ① 选择活动
    ===================================================== -->

      <div class="card">
        <div class="card-title">
          <span class="section-number"> ① </span>

          <span data-i18n="selectActivity"> 选择活动 </span>
        </div>

        <div id="activityList" class="activity-list">
          <div class="empty" data-i18n="loadingActivities">正在加载活动...</div>
        </div>

        <div id="selectedActivitySummary" class="selected-summary">
          尚未选择活动
        </div>
      </div>

      <!-- =====================================================
         ② 报名人
    ===================================================== -->

      <div class="card">
        <div class="card-title">
          <span class="section-number"> ② </span>

          <span data-i18n="booker"> 报名人 </span>
        </div>

        <div class="form-group">
          <label data-i18n="bookerName"> 报名人姓名 </label>

          <input
            id="bookerName"
            type="text"
            autocomplete="name"
            data-i18n-placeholder="bookerPlaceholder"
            placeholder="请输入报名人姓名"
          />

          <div class="booker-tip" data-i18n="bookerTip">
            💡 第 1 位参加人员默认使用报名人的姓名。
            如果需要替别人报名，可以继续添加参加人员。
          </div>
        </div>
      </div>

      <!-- =====================================================
         ③ 参加人员
    ===================================================== -->

      <div class="card">
        <div class="card-title">
          <span class="section-number"> ③ </span>

          <span data-i18n="participants"> 参加人员 </span>
        </div>

        <div id="participantsContainer"></div>

        <button
          type="button"
          class="add-btn"
          onclick="addParticipant()"
          data-i18n="addParticipant"
        >
          ＋ 添加参加人员
        </button>
      </div>

      <!-- =====================================================
         ④ 备注
    ===================================================== -->

      <div class="card">
        <div class="card-title">
          <span class="section-number"> ④ </span>

          <span data-i18n="remark"> 备注 </span>
        </div>

        <div class="form-group">
          <textarea
            id="message"
            data-i18n-placeholder="remarkPlaceholder"
            placeholder="如有需要，请输入备注"
          ></textarea>
        </div>
      </div>

      <!-- =====================================================
         提交
    ===================================================== -->

      <div class="card">
        <button
          id="submitBtn"
          class="submit-btn"
          type="button"
          onclick="submitRegistration()"
          data-i18n="submit"
        >
          提交报名
        </button>

        <div id="loading" class="loading" data-i18n="submitting">
          正在提交报名，请稍候...
        </div>
      </div>

      <!-- =====================================================
         报名结果
    ===================================================== -->

      <div id="resultCard" class="card" style="display: none">
        <div class="card-title">
          <span class="section-number"> ✓ </span>

          <span data-i18n="result"> 报名结果 </span>
        </div>

        <div id="resultBox" class="result-box"></div>
      </div>
    </div>

        window.location.href = HOME_URL;

      /* =====================================================
             加载活动
             PWA → GAS
          ===================================================== */

      /* =====================================================
         加载活动
         Offline First

         ① 有 IndexedDB 缓存
            → 立即显示
            → 后台更新

         ② 没有 IndexedDB 缓存
            → 请求服务器
            → 成功后保存 IndexedDB

         ③ 网络失败
            → 有缓存：继续使用缓存
            → 无缓存：显示加载失败
      ===================================================== */

      async function loadActivities() {
        const box = document.getElementById("activityList");

        box.innerHTML = `
          <div class="empty">
            ${escapeHtml(t("loadingActivities"))}
          </div>
        `;

        let hasLocalCache = false;

        // =====================================================
        // 1. 先读取 IndexedDB
        // =====================================================

        try {
          const cachedActivities = await dbGetAll("activities");

          console.log("本地活动列表缓存:", cachedActivities);

          if (Array.isArray(cachedActivities) && cachedActivities.length > 0) {
            hasLocalCache = true;

            activities = cachedActivities;

            // 立即显示
            renderActivities(activities);

            console.log("已有本地活动列表缓存，开始后台更新...");

            // 后台更新
            updateActivitiesInBackground();

            return;
          }
        } catch (error) {
          console.warn("读取本地活动缓存失败:", error);
        }

        // =====================================================
        // 2. 没有本地缓存
        // 第一次必须联网
        // =====================================================

        try {
          await fetchActivitiesFromServer();
        } catch (error) {
          console.error("活动加载失败:", error);

          // ===================================================
          // 没有缓存 + 网络失败
          // ===================================================

          if (!hasLocalCache) {
            box.innerHTML = `
              <div class="empty">
                ${escapeHtml(t("activityLoadFailed"))}
                <br>
                <small>
                  ${escapeHtml(
                    navigator.onLine
                      ? error.message || error
                      : currentLanguage === "zh"
                        ? "当前没有网络，且本地没有活动缓存。"
                        : "現在オフラインで、ローカルにイベントキャッシュがありません。",
                  )}
                </small>
              </div>
            `;
          }
        }
      }

      /* =====================================================
         从服务器获取活动
      ===================================================== */

      async function fetchActivitiesFromServer() {
        const response = await fetch(GAS_URL, {
          method: "POST",

          headers: {
            "Content-Type": "text/plain;charset=utf-8",
          },

          body: JSON.stringify({
            action: "pwaCheckin",
            type: "getActivities",
          }),
        });

        if (!response.ok) {
          throw new Error("HTTP错误: " + response.status);
        }

        const result = await response.json();

        console.log("服务器活动列表:", result);

        const list = Array.isArray(result)
          ? result
          : result && Array.isArray(result.data)
            ? result.data
            : null;

        // =====================================================
        // 返回格式错误
        // =====================================================

        if (!Array.isArray(list)) {
          throw new Error("服务器返回的活动数据格式错误");
        }

        // =====================================================
        // 更新内存
        // =====================================================

        activities = list;

        // =====================================================
        // 保存 IndexedDB
        //
        // 注意：
        // 这里暂时不 clear activities。
        // dbPutAll 会按照 ActivityID 更新已有数据。
        // =====================================================

        if (list.length > 0) {
          await dbPutAll("activities", list);

          console.log("活动列表已缓存到 IndexedDB:", list.length);
        }

        // =====================================================
        // 更新页面
        // =====================================================

        renderActivities(activities);

        return activities;
      }

      /* =====================================================
         后台更新活动
         不阻塞当前页面
      ===================================================== */

      async function updateActivitiesInBackground() {
        try {
          await fetchActivitiesFromServer();

          console.log("活动列表后台更新完成");
        } catch (error) {
          console.warn("活动列表后台更新失败，继续使用本地缓存:", error);

          /*
           * 这里故意什么都不做。
           *
           * 当前页面已经有：
           *
           * activities = 本地缓存
           *
           * 所以后台失败时：
           * → 不清空
           * → 不重新 render
           * → 用户继续正常使用
           */
        }
      }

      /* =====================================================
             显示活动
             V7：checkbox + 多选
          ===================================================== */

      function renderActivities(list) {
        const container = document.getElementById("activityList");

        if (!list || list.length === 0) {
          container.innerHTML = `
                <div class="empty">
                  ${escapeHtml(t("noActivities"))}
                </div>
              `;

          updateSelectedActivitySummary();

          return;
        }

        container.innerHTML = "";

        /*
         * 从 URL 取得当前 ActivityID
         *
         * 活动详情 → 我要报名
         *
         * registration.html?id=ACTxxxx
         */

        const params = new URLSearchParams(window.location.search);

        const currentActivityID = normalize(
          params.get("id") || params.get("activityID") || "",
        );

        list.forEach(function (activity) {
          const activityID = normalize(
            activity.ActivityID || activity.activityID || activity.id,
          );

          if (!activityID) {
            return;
          }

          const title = normalize(
            activity.Title || activity.title || "未命名活动",
          );

          const date = normalize(
            activity.ActivityDate || activity.Date || activity.date,
          );

          const startTime = normalize(activity.StartTime || activity.startTime);

          const endTime = normalize(activity.EndTime || activity.endTime);

          const capacity = normalize(activity.Capacity || activity.capacity);

          const fee = normalize(activity.Fee || activity.fee);

          const item = document.createElement("div");

          item.className = "activity-item";

          item.dataset.id = activityID;

          item.innerHTML = `

                  <div class="activity-top">

                    <input
                      class="activity-checkbox"
                      type="checkbox"
                      value="${escapeHtml(activityID)}"
                    >

                    <div class="activity-title">
                      🏸
                      ${escapeHtml(title)}
                    </div>

                  </div>


                  <div class="activity-info">

                    ${
                      date
                        ? `
                          <div class="activity-info-row">
                            📅
                            ${escapeHtml(t("activityDate"))}：
                            ${escapeHtml(formatDate(date))}
                          </div>
                        `
                        : ""
                    }


                    ${
                      startTime
                        ? `
                          <div class="activity-info-row">
                            ⏰
                            ${escapeHtml(t("activityTime"))}：
                            ${escapeHtml(formatTime(startTime))}
                            ${endTime ? " ～ " + escapeHtml(formatTime(endTime)) : ""}
                          </div>
                        `
                        : ""
                    }


                    ${
                      activity.VenueName
                        ? `
                          <div class="activity-info-row">
                            📍
                            ${escapeHtml(activity.VenueName)}
                          </div>
                        `
                        : ""
                    }


                    ${
                      capacity
                        ? `
                          <div class="activity-info-row">
                            👥
                            ${escapeHtml(t("capacity"))}：
                            ${escapeHtml(capacity)}
                          </div>
                        `
                        : ""
                    }


                    ${
                      fee !== ""
                        ? `
                          <div class="activity-info-row">
                            💴
                            ${escapeHtml(t("fee"))}：
                            ${escapeHtml(fee)}
                          </div>
                        `
                        : ""
                    }

                  </div>

                `;

          const checkbox = item.querySelector(".activity-checkbox");

          /*
           * 如果从活动详情进入，
           * 自动选择当前活动
           */

          if (currentActivityID && activityID === currentActivityID) {
            checkbox.checked = true;

            item.classList.add("selected");
          }

          /*
           * 点击整张活动卡片
           */

          item.addEventListener("click", function (event) {
            if (event.target !== checkbox) {
              checkbox.checked = !checkbox.checked;
            }

            if (checkbox.checked) {
              item.classList.add("selected");
            } else {
              item.classList.remove("selected");
            }

            updateSelectedActivitySummary();
          });

          container.appendChild(item);
        });

        updateSelectedActivitySummary();
      }

      /* =====================================================
             获取选择的活动
             V7 核心逻辑
          ===================================================== */

      function getSelectedActivityIDs() {
        const checkboxes = document.querySelectorAll(
          "#activityList input[type='checkbox']:checked",
        );

        return Array.from(checkboxes)
          .map(function (checkbox) {
            return normalize(checkbox.value);
          })
          .filter(function (id) {
            return id !== "";
          });
      }

      /* =====================================================
             已选择活动显示
          ===================================================== */

      function updateSelectedActivitySummary() {
        const ids = getSelectedActivityIDs();

        const box = document.getElementById("selectedActivitySummary");

        if (!box) {
          return;
        }

        if (ids.length === 0) {
          box.textContent = t("noActivitySelected");

          return;
        }

        box.innerHTML =
          escapeHtml(t("selectedActivities")) +
          " <strong>" +
          ids.length +
          "</strong> " +
          escapeHtml(t("activitiesUnit")) +
          "： " +
          ids
            .map(function (id) {
              const activity = activities.find(function (a) {
                return normalize(a.ActivityID || a.activityID || a.id) === id;
              });

              return escapeHtml(
                activity ? activity.Title || activity.title || id : id,
              );
            })
            .join("、");
      }

      /* =====================================================
             添加参加人员
             V7 原逻辑
          ===================================================== */

      function addParticipant(data) {
        participantCounter++;

        const id = "participant_" + participantCounter;

        let participant;

        if (data) {
          participant = {
            name: normalize(data.name),

            searchKey: normalize(data.searchKey),

            level: normalize(data.level),

            searchKeyManuallyChanged: data.searchKeyManuallyChanged === true,
          };
        } else {
          const isFirst = selectedMembers.length === 0;

          const bookerInput = document.getElementById("bookerName");

          const bookerName = bookerInput ? normalize(bookerInput.value) : "";

          participant = {
            name: isFirst ? bookerName : "",

            searchKey: isFirst ? bookerName : "",

            level: "",

            searchKeyManuallyChanged: false,
          };
        }

        selectedMembers.push({
          id: id,

          name: participant.name || "",

          searchKey: participant.searchKey || "",

          level: participant.level || "",

          searchKeyManuallyChanged:
            participant.searchKeyManuallyChanged === true,
        });

        if (selectedMembers.length === 1) {
          selectedMembers[0].name = normalize(
            document.getElementById("bookerName").value,
          );

          selectedMembers[0].searchKey =
            selectedMembers[0].searchKey || selectedMembers[0].name;

          selectedMembers[0].searchKeyManuallyChanged = false;
        }

        renderParticipants();
      }

      /* =====================================================
             第一位参加人员跟随报名人
             V7 原逻辑
          ===================================================== */

      function syncFirstParticipantWithBooker() {
        const first = selectedMembers[0];

        if (!first) {
          return;
        }

        const bookerName = normalize(
          document.getElementById("bookerName").value,
        );

        first.name = bookerName;

        if (!first.searchKeyManuallyChanged) {
          first.searchKey = bookerName;
        }

        const firstCard = document.querySelector(
          '.participant[data-id="' + first.id + '"]',
        );

        if (!firstCard) {
          return;
        }

        const nameInput = firstCard.querySelector('[data-field="name"]');

        if (nameInput) {
          nameInput.value = first.name;
        }

        const searchKeyInput = firstCard.querySelector(
          '[data-field="searchKey"]',
        );

        if (searchKeyInput && !first.searchKeyManuallyChanged) {
          searchKeyInput.value = first.searchKey;
        }
      }

      /* =====================================================
             删除参加人员
             V7：不能删除最后一人
          ===================================================== */

      function removeParticipant(id) {
        if (selectedMembers.length <= 1) {
          showMessage(t("atLeastParticipant"), "warning");

          return;
        }

        const index = selectedMembers.findIndex(function (member) {
          return member.id === id;
        });

        const wasFirst = index === 0;

        selectedMembers = selectedMembers.filter(function (member) {
          return member.id !== id;
        });

        if (wasFirst) {
          const first = selectedMembers[0];

          if (first) {
            const bookerName = normalize(
              document.getElementById("bookerName").value,
            );

            first.name = bookerName;

            first.searchKey = bookerName;

            first.searchKeyManuallyChanged = false;
          }
        }

        renderParticipants();
      }

      /* =====================================================
             从HTML更新参加人员
          ===================================================== */

      function updateParticipantFromDOM(id, input) {
        const member = selectedMembers.find(function (item) {
          return item.id === id;
        });

        if (!member) {
          return;
        }

        const field = input.dataset.field;

        if (field === "name") {
          member.name = input.value;

          if (!member.searchKeyManuallyChanged) {
            member.searchKey = input.value;

            const card = input.closest(".participant");

            if (card) {
              const searchKeyInput = card.querySelector(
                '[data-field="searchKey"]',
              );

              if (searchKeyInput) {
                searchKeyInput.value = input.value;
              }
            }
          }
        } else if (field === "searchKey") {
          member.searchKey = input.value;

          member.searchKeyManuallyChanged = true;
        } else {
          member[field] = input.value;

          if (field === "level") {
            const card = input.closest(".participant");

            if (card) {
              const description = card.querySelector(".level-description");

              if (description) {
                description.textContent = getLevelDescription(member.level);
              }
            }
          }
        }
      }

      /* =====================================================
             收集参加人员
          ===================================================== */

      function collectParticipants() {
        const cards = document.querySelectorAll(".participant");

        cards.forEach(function (card) {
          const id = card.dataset.id;

          const member = selectedMembers.find(function (item) {
            return item.id === id;
          });

          if (!member) {
            return;
          }

          const nameInput = card.querySelector('[data-field="name"]');

          const levelInput = card.querySelector('[data-field="level"]');

          const searchKeyInput = card.querySelector('[data-field="searchKey"]');

          member.name = nameInput ? normalize(nameInput.value) : "";

          member.level = levelInput ? normalize(levelInput.value) : "";

          member.searchKey = searchKeyInput
            ? normalize(searchKeyInput.value)
            : "";

          if (!member.searchKey && !member.searchKeyManuallyChanged) {
            member.searchKey = member.name;
          }
        });

        return selectedMembers.map(function (member) {
          return {
            name: normalize(member.name),

            level: normalize(member.level),

            searchKey: normalize(member.searchKey),
          };
        });
      }

      /* =====================================================
             检查重复姓名
          ===================================================== */

      function checkDuplicateParticipantNames(participants) {
        const nameMap = {};

        for (let i = 0; i < participants.length; i++) {
          const name = normalize(participants[i].name);

          if (!name) {
            continue;
          }

          const key = name.toLowerCase();

          if (nameMap[key] !== undefined) {
            return {
              duplicate: true,

              name: name,

              firstIndex: nameMap[key],

              secondIndex: i,
            };
          }

          nameMap[key] = i;
        }

        return {
          duplicate: false,
        };
      }

      /* =====================================================
             提交报名
             PWA → GAS
          ===================================================== */

      async function processSyncQueue() {
        if (!navigator.onLine) {
          console.log("[SYNC] 当前没有网络，不进行同步");
          return;
        }

        const queue = await getSyncQueue();

        if (!queue || queue.length === 0) {
          console.log("[SYNC] 没有需要同步的任务");
          return;
        }

        console.log("[SYNC] 开始同步任务:", queue);

        for (const task of queue) {
          try {
            console.log("[SYNC] 正在发送:", task);

            const response = await fetch(GAS_URL, {
              method: "POST",
              mode: "cors",
              headers: {
                "Content-Type": "text/plain;charset=utf-8",
              },
              body: JSON.stringify(task.data),
            });

            console.log("[SYNC] response.type =", response.type);
            console.log("[SYNC] response.status =", response.status);
            console.log("[SYNC] response.ok =", response.ok);

            if (!response.ok) {
              throw new Error("HTTP错误: " + response.status);
            }

            const result = await response.json();

            console.log("[SYNC] GAS 返回:", result);

            if (!result || result.success !== true) {
              throw new Error(
                result?.message || result?.error || "服务器处理失败",
              );
            }

            await removeSyncTask(task.id);

            console.log("[SYNC] 同步成功，已删除任务:", task.id);
          } catch (error) {
            console.error("[SYNC] 同步失败，保留任务:", task.id, error);
          }
        }
      }

      window.addEventListener("online", function () {
        console.log("[SYNC] 网络恢复，开始自动同步");

        processSyncQueue();
      });

      async function submitRegistration() {
        clearMessage();

        const activityIDs = getSelectedActivityIDs();

        if (activityIDs.length === 0) {
          showMessage(t("atLeastActivity"), "error");
          return;
        }

        let bookerName = normalize(document.getElementById("bookerName").value);

        const participants = collectParticipants();

        if (participants.length === 0) {
          showMessage(t("atLeastParticipant"), "error");
          return;
        }

        if (!bookerName) {
          bookerName = participants[0].name;
          document.getElementById("bookerName").value = bookerName;
        }

        for (let i = 0; i < participants.length; i++) {
          if (!participants[i].name) {
            showMessage(
              t("fillParticipantName").replace("{n}", i + 1),
              "error",
            );
            return;
          }
        }

        const duplicateCheck = checkDuplicateParticipantNames(participants);

        if (duplicateCheck.duplicate) {
          showMessage(
            t("duplicateName")
              .replace("{name}", duplicateCheck.name)
              .replace("{a}", duplicateCheck.firstIndex + 1)
              .replace("{b}", duplicateCheck.secondIndex + 1),
            "error",
          );

          return;
        }

        const message = normalize(document.getElementById("message").value);

        /*
         * =====================================================
         * 为每个活动生成独立请求
         * =====================================================
         */

        const requestList = activityIDs.map(function (activityID) {
          const clientRequestID =
            "REQ-" +
            Date.now() +
            "-" +
            Math.random().toString(36).substring(2, 10);

          const data = {
            activityIDs: [activityID],
            bookerName: bookerName,
            participants: participants,
            message: message,
            clientRequestID: clientRequestID,
          };

          return {
            action: "pwaCheckin",
            type: "registerActivities",
            data: data,
          };
        });

        console.log("registerActivities requestList:", requestList);

        setSubmitting(true);

        /*
         * =====================================================
         * 离线模式
         * =====================================================
         */

        if (!navigator.onLine) {
          try {
            for (const requestData of requestList) {
              await addSyncTask({
                action: "registerActivities",
                data: requestData,
              });

              console.log("[SYNC] 活动已保存到离线同步队列:", requestData);
            }

            setSubmitting(false);

            showMessage(
              "当前没有网络，报名已保存，网络恢复后会自动发送。",
              "success",
            );

            return;
          } catch (error) {
            console.error("[SYNC] 保存离线报名失败:", error);

            setSubmitting(false);

            showMessage(
              "无法保存离线报名：" + (error.message || error),
              "error",
            );

            return;
          }
        }

        /*
         * =====================================================
         * 在线模式
         * =====================================================
         */

        const results = [];

        for (const requestData of requestList) {
          try {
            console.log(
              "[REGISTER] 正在提交活动:",
              requestData.data.activityIDs[0],
              requestData.data.clientRequestID,
            );

            const response = await fetch(GAS_URL, {
              method: "POST",

              headers: {
                "Content-Type": "text/plain;charset=utf-8",
              },

              body: JSON.stringify(requestData),
            });

            if (!response.ok) {
              throw new Error("HTTP错误: " + response.status);
            }

            const result = await response.json();

            console.log(
              "[REGISTER] 活动报名结果:",
              requestData.data.activityIDs[0],
              result,
            );

            results.push(result);
          } catch (error) {
            console.error(
              "[REGISTER] 活动报名失败:",
              requestData.data.activityIDs[0],
              error,
            );

            /*
             * 只有当前失败的活动进入同步队列
             */

            try {
              await addSyncTask({
                action: "registerActivities",
                data: requestData,
              });

              console.log(
                "[SYNC] 单个活动已进入同步队列:",
                requestData.data.activityIDs[0],
              );
            } catch (queueError) {
              console.error("[SYNC] 保存同步队列失败:", queueError);
            }
          }
        }

        setSubmitting(false);

        /*
         * =====================================================
         * 处理在线报名结果
         * =====================================================
         */

        if (results.length === 1) {
          handleRegistrationResult(results[0]);
        } else if (results.length > 1) {
          console.log("[REGISTER] 多个活动报名结果:", results);

          const successCount = results.filter(function (result) {
            return result && result.success === true;
          }).length;

          const failedCount = results.length - successCount;

          if (failedCount === 0) {
            showMessage(
              "报名成功！共 " + successCount + " 个活动全部报名成功。",
              "success",
            );
          } else {
            showMessage(
              "报名完成：成功 " +
                successCount +
                " 个，失败 " +
                failedCount +
                " 个。",
              failedCount > 0 ? "error" : "success",
            );
          }
        } else {
          showMessage("网络暂时不可用，报名已保存到同步队列。", "success");
        }
      }

      /* =====================================================
             处理报名结果
          ===================================================== */

      function handleRegistrationResult(result) {
        if (!result) {
          showMessage(t("serverNoResult"), "error");

          return;
        }

        if (result.success !== true) {
          showMessage(
            result.message || t("registrationFailedSimple"),

            "error",
          );

          showResult(result);

          return;
        }

        if (result.partial === true) {
          showMessage(
            result.message || t("partialSuccess"),

            "warning",
          );
        } else {
          showMessage(
            result.message || t("allSuccess"),

            "success",
          );
        }

        showResult(result);
      }

      /* =====================================================
             显示报名结果
          ===================================================== */

      function showResult(result) {
        const card = document.getElementById("resultCard");

        const box = document.getElementById("resultBox");

        card.style.display = "block";

        let html = "";

        if (result.registrationGroupID) {
          html += `

                <div class="result-item">

                  <strong>
                    ${escapeHtml(t("groupID"))}
                  </strong>

                  ${escapeHtml(result.registrationGroupID)}

                </div>

              `;
        }

        if (result.bookerName) {
          html += `

                <div class="result-item">

                  <strong>
                    ${escapeHtml(t("bookerResult"))}
                  </strong>

                  ${escapeHtml(result.bookerName)}

                </div>

              `;
        }

        if (result.total !== undefined) {
          html += `

                <div class="result-item">

                  <strong>
                    ${escapeHtml(t("total"))}
                  </strong>

                  ${result.total}

                  &nbsp;&nbsp;

                  <span class="status-confirmed">

                    ${escapeHtml(t("success"))}

                    ${result.successCount || 0}

                  </span>

                  &nbsp;&nbsp;

                  <span class="status-failed">

                    ${escapeHtml(t("failed"))}

                    ${result.failedCount || 0}

                  </span>

                </div>

              `;
        }

        if (Array.isArray(result.data) && result.data.length > 0) {
          html += `

                <div class="result-item">

                  <strong>
                    ${escapeHtml(t("detail"))}
                  </strong>

                </div>

              `;

          result.data.forEach(function (item) {
            const participantName = normalize(item.participantName);

            const activityID = normalize(item.activityID);

            const r = item.result || {};

            let statusClass = "status-failed";

            let statusText = t("statusFailed");

            if (r.success === true) {
              if (r.status === "WAITLIST") {
                statusClass = "status-waitlist";

                statusText = t("waitlist");
              } else {
                statusClass = "status-confirmed";

                statusText = t("statusSuccess");
              }
            }

            html += `

                    <div class="result-item">

                      <div>

                        <strong>
                          ${escapeHtml(participantName)}
                        </strong>

                        →

                        ${escapeHtml(activityID)}

                      </div>


                      <div
                        class="${statusClass}"
                      >

                        ${escapeHtml(statusText)}

                        ${r.message ? "： " + escapeHtml(r.message) : ""}

                      </div>


                      ${
                        r.title
                          ? `
                            <div>
                              ${escapeHtml(t("activity"))}
                              ${escapeHtml(r.title)}
                            </div>
                          `
                          : ""
                      }

                    </div>

                  `;
          });
        }

        if (!html) {
          html = escapeHtml(t("noDetail"));
        }

        box.innerHTML = html;

        card.scrollIntoView({
          behavior: "smooth",

          block: "start",
        });
      }

      /* =====================================================
             提交按钮状态
          ===================================================== */

      function setSubmitting(submitting) {
        const button = document.getElementById("submitBtn");

        const loading = document.getElementById("loading");

        button.disabled = submitting;

        loading.style.display = submitting ? "block" : "none";

        button.textContent = submitting ? t("submittingShort") : t("submit");
      }

      /* =====================================================
             显示消息
          ===================================================== */

      function showMessage(text, type) {
        const box = document.getElementById("messageBox");

        box.className = "message " + (type || "success");

        box.innerHTML = escapeHtml(text || "");

        box.style.display = "block";

        box.scrollIntoView({
          behavior: "smooth",

          block: "start",
        });
      }

      /* =====================================================
             清除消息
          ===================================================== */

      function clearMessage() {
        const box = document.getElementById("messageBox");

        box.className = "message";

        box.innerHTML = "";

        box.style.display = "none";
      }

      /* =====================================================
             Normalize
          ===================================================== */

      function normalize(value) {
        if (value === null || value === undefined) {
          return "";
        }

        return String(value).trim();
      }

      /* =====================================================
             日期
          ===================================================== */

      function formatDate(value) {
        if (!value) {
          return "";
        }

        const date = new Date(value);

        if (isNaN(date.getTime())) {
          return String(value);
        }

        return (
          date.getFullYear() +
          "-" +
          String(date.getMonth() + 1).padStart(2, "0") +
          "-" +
          String(date.getDate()).padStart(2, "0")
        );
      }

      /* =====================================================
             时间
          ===================================================== */

      function formatTime(value) {
        if (!value) {
          return "";
        }

        /*
         * GAS 已经返回 HH:mm
         */

        const text = String(value).trim();

        if (/^\d{1,2}:\d{2}$/.test(text)) {
          const parts = text.split(":");

          return String(Number(parts[0])).padStart(2, "0") + ":" + parts[1];
        }

        return text;
      }

      /* =====================================================
             HTML Escape
          ===================================================== */

      function escapeHtml(value) {
        return String(value === null || value === undefined ? "" : value)
          .replace(/&/g, "&amp;")

          .replace(/</g, "&lt;")

          .replace(/>/g, "&gt;")

          .replace(/"/g, "&quot;")

          .replace(/'/g, "&#039;");
      }
    </script>
  </body>
</html>
